[project]
name = "parsearena"
version = "0.1.2"
description = "Run your PDFs through Docling, Marker, MinerU and Unstructured. Compare the output side by side and see what each one does to retrieval."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Diego Pérez" }]
requires-python = ">=3.11,<3.15"
keywords = ["pdf", "parsing", "rag", "retrieval", "docling", "marker", "mineru", "unstructured", "benchmark"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Text Processing",
]
dependencies = [
    "typer==0.27.3",
    "rich==15.0.0",
    "pyyaml==6.0.3",
    "pypdfium2==5.14.0",
    "pillow==13.0.0",
    "numpy==2.3.5",
    "fastembed==0.9.1",
    "openai==3.42.1",
]

[project.urls]
Homepage = "https://diegoperezg7.github.io/parsearena/"
Repository = "https://github.com/diegoperezg7/parsearena"
Issues = "https://github.com/diegoperezg7/parsearena/issues"

[project.scripts]
parsearena = "parsearena.cli:main"

[dependency-groups]
dev = ["pytest==9.2.0", "ruff==0.17.3"]

[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/parsearena"]

[tool.hatch.build.targets.sdist]
include = ["src/parsearena", "tests", "README.md", "README.es.md", "LICENSE", "CHANGELOG.md"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]  # typer declares options as argument defaults

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["heavy: runs a real parser in an isolated environment (downloads models); skipped by default"]
addopts = "-m 'not heavy'"
