# Hand-written question set for the bundled demo PDFs.
# Each answer is a short string copied from the original page.
questions:
  # U.S. Census Bureau, Income in the United States: 2023 (text page, chart page, table page)
  - id: census-median
    doc: census-income-2023.pdf
    q: What was real median household income in the United States in 2023?
    answers: ["80,610"]
  - id: census-cpi
    doc: census-income-2023.pdf
    q: How much did consumer prices rise between 2022 and 2023 according to the C-CPI-U?
    answers: ["4.0 percent increase"]
  - id: census-earnings-ratio
    doc: census-income-2023.pdf
    q: What was the female-to-male earnings ratio for full-time, year-round workers in 2023?
    answers: ["82.7 percent"]
  - id: census-survey
    doc: census-income-2023.pdf
    q: Which survey supplement are the income estimates based on?
    answers: ["Annual Social and Economic Supplements"]
  - id: census-asian
    doc: census-income-2023.pdf
    q: What was the median income of Asian households in 2023?
    answers: ["112,800"]
  - id: census-bachelor
    doc: census-income-2023.pdf
    q: What was the median household income for householders with a bachelor's degree or higher in 2023?
    answers: ["126,800"]
  - id: census-midwest
    doc: census-income-2023.pdf
    q: What was the median household income in the Midwest in 2023?
    answers: ["81,020"]
  - id: census-nonmetro
    doc: census-income-2023.pdf
    q: What was the median income of households outside metropolitan statistical areas in 2023?
    answers: ["62,520"]
  - id: census-households
