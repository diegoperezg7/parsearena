  # Rafailov et al., Direct Preference Optimization (arXiv:2305.18290, CC BY 4.0)
  - id: dpo-name
    doc: dpo-arxiv-2305.18290.pdf
    q: What does the acronym DPO stand for?
    answers: ["Direct Preference Optimization"]
  - id: dpo-preference-model
    doc: dpo-arxiv-2305.18290.pdf
    q: Under which preference model does the partition function cancel out in the DPO derivation?
    answers: ["Bradley-Terry"]
  - id: dpo-z
    doc: dpo-arxiv-2305.18290.pdf
    q: What is Z(x) called in the closed-form optimal policy?
    answers: ["partition function"]
  - id: dpo-gradient-weight
    doc: dpo-arxiv-2305.18290.pdf
    q: In the gradient of the DPO loss, when does an example get a higher weight?
    answers: ["when reward estimate is wrong"]
  - id: dpo-tldr
    doc: dpo-arxiv-2305.18290.pdf
    q: What win rate does DPO reach on TL;DR summarization at temperature 0.0?
    answers: ["61%"]
  - id: dpo-cnn
    doc: dpo-arxiv-2305.18290.pdf
    q: What GPT-4 win rate against ground truth does DPO get on CNN/DailyMail at temperature 0?
    answers: ["0.36"]
  - id: dpo-dialogue-model
    doc: dpo-arxiv-2305.18290.pdf
    q: Which pre-trained model is the starting point for the single-turn dialogue experiments?
    answers: ["Pythia-2.8B"]
  - id: dpo-venue
    doc: dpo-arxiv-2305.18290.pdf
    q: At which conference was the DPO paper published?
    answers: ["NeurIPS 2023"]

